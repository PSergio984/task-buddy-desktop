name: Desktop CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "feat/**", "feature/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test & Typecheck
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Frontend Tests
        run: npm test

      - name: Frontend Typecheck & Build
        run: npm run build

      - name: Run Rust Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  bundle:
    name: Build Windows Desktop Bundle
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Desktop Installer
        run: npm run tauri -- build --ci

      - name: Upload Windows Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: task-buddy-desktop-windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

